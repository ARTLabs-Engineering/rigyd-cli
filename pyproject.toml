[project]
name = "rigyd"
version = "1.0.0"
description = "Convert any 3D model, text prompt, or image into a physics-enabled SimReady simulation asset (USD / MJCF) with Rigyd — SDK + CLI."
authors = [{ name = "Rigyd", email = "hello@rigyd.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["rigyd", "simready", "usd", "mjcf", "mujoco", "isaac-sim", "robotics", "simulation", "cli"]

[project.optional-dependencies]
mujoco = ["mujoco>=3.0"]

[project.scripts]
rigyd = "rigyd.cli:main"

[project.urls]
Homepage = "https://rigyd.com"
Documentation = "https://docs.rigyd.com"
Repository = "https://github.com/ARTLabs-Engineering/rigyd-python"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rigyd"]
